<style>
:root{
  --blue:#1E10C7;
  --blue-h:#3428F0;
  --blue-light:#f0f0ff;
  --orange:#EE4E00;
  --divider:rgba(30,16,199,.12);
  --text:#0a0a1a;
  --sub:rgba(10,10,26,.5);
  --topbar-h:72px;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#fff;color:var(--text)}
body{font-family:'Noto Sans KR',sans-serif;-webkit-font-smoothing:antialiased}

/* TOP BAR */
#topbar{
  position:fixed;top:0;left:0;right:0;z-index:200;
  height:var(--topbar-h);
  display:flex;justify-content:space-between;align-items:center;
  padding:0 clamp(1.5rem,3.5vw,4rem);
  border-bottom:1px solid var(--divider);
  background:#fff;
}
.logo-img{
  height:clamp(36px,3.2vw,52px);
  width:auto;object-fit:contain;opacity:0;
}
.topbar-contact{
  font-size:clamp(.72rem,.75vw,.82rem);font-weight:700;letter-spacing:.06em;
  color:var(--blue);text-decoration:none;
  border:1px solid rgba(30,16,199,.25);
  padding:.55rem clamp(1rem,1.5vw,1.5rem);border-radius:100px;
  transition:all .25s;opacity:0;white-space:nowrap;
}
.topbar-contact:hover{background:var(--blue);color:#fff}

/* HUB LAYOUT */
#hub{
  display:flex;height:100vh;width:100vw;
  padding-top:var(--topbar-h);
}

/* EACH PATH */
.path{
  flex:1;position:relative;
  display:flex;flex-direction:column;
  justify-content:center;align-items:flex-start;
  padding:clamp(2.5rem,5vh,5rem) clamp(2rem,4.5vw,6rem);
  cursor:pointer;overflow:hidden;
  text-decoration:none;color:inherit;
  transition:flex .55s cubic-bezier(.16,1,.3,1),background .4s;
}
.path:hover{flex:1.14;background:var(--blue-light)}
.path:hover .path-num{color:var(--blue);opacity:1}

/* DIVIDER */
.path-divider{
  width:1px;background:var(--divider);
  flex-shrink:0;align-self:stretch;margin:clamp(2rem,4vh,4rem) 0;
}

/* PATH NUMBER */
.path-num{
  font-family:'Plus Jakarta Sans',sans-serif;
  font-size:clamp(4rem,9vw,10rem);font-weight:700;
  line-height:1;letter-spacing:-.06em;
  color:rgba(30,16,199,.07);
  position:absolute;top:clamp(1.2rem,2.5vh,2.5rem);right:clamp(1.5rem,2.5vw,3rem);
  transition:color .4s,opacity .4s;
  pointer-events:none;opacity:0;
}

/* PATH CONTENT */
.path-eye{
  font-size:clamp(.6rem,.65vw,.72rem);letter-spacing:.28em;text-transform:uppercase;
  font-weight:700;color:var(--blue);
  margin-bottom:clamp(.8rem,1.5vh,1.3rem);opacity:0;
}
.path-title{
  font-family:'Plus Jakarta Sans','Noto Sans KR',sans-serif;
  font-size:clamp(2rem,3.6vw,4.4rem);font-weight:800;
  line-height:1.04;letter-spacing:-.04em;
  color:var(--text);margin-bottom:clamp(.7rem,1.2vh,1rem);opacity:0;
  text-wrap:balance;
}
.path-title em{color:var(--blue);font-style:normal}
.path-sub{
  font-size:clamp(.85rem,1vw,.98rem);line-height:1.75;
  max-width:34ch;color:var(--sub);
  margin-bottom:clamp(1.2rem,2.5vh,2rem);opacity:0;
}
.path-tags{
  display:flex;flex-wrap:wrap;gap:.45rem;
  margin-bottom:clamp(1.5rem,3vh,2.5rem);opacity:0;
}
.path-tag{
  font-size:clamp(.62rem,.65vw,.72rem);letter-spacing:.05em;
  padding:.3rem clamp(.7rem,1vw,.95rem);border-radius:100px;font-weight:600;
  background:rgba(30,16,199,.06);
  color:rgba(30,16,199,.75);
  border:1px solid rgba(30,16,199,.14);
}
.path-cta{
  display:inline-flex;align-items:center;gap:.8rem;
  font-size:clamp(.82rem,.88vw,.92rem);font-weight:700;letter-spacing:.04em;
  padding:clamp(.8rem,1.2vh,1rem) clamp(1.6rem,2vw,2.2rem);border-radius:100px;
  background:var(--blue);color:#fff;border:none;
  transition:all .3s;opacity:0;position:relative;
}
.path-cta::after{
  content:'';position:absolute;top:6px;right:6px;
  width:6px;height:6px;border-radius:50%;
  background:var(--orange);
}
.path-cta:hover{background:var(--blue-h);transform:translateY(-2px);box-shadow:0 8px 28px rgba(30,16,199,.3)}
.path-arr{
  width:26px;height:2px;background:#fff;position:relative;
  flex-shrink:0;transition:width .3s;
}
.path-cta:hover .path-arr{width:40px}
.path-arr::after{
  content:'';position:absolute;right:0;top:50%;
  transform:translateY(-50%) rotate(45deg);
  width:6px;height:6px;border-right:1.5px solid #fff;border-top:1.5px solid #fff;
}

/* TABLET */
@media(max-width:1024px) and (min-width:768px){
  :root{--topbar-h:64px}
  .path{padding:clamp(2rem,4vh,4rem) clamp(1.8rem,3.5vw,3.5rem)}
  .path-title{font-size:clamp(1.9rem,3vw,3rem)}
  .path-sub{max-width:28ch;font-size:.88rem}
  .path-num{font-size:clamp(3.5rem,7vw,6rem)}
}

/* MOBILE */
@media(max-width:767px){
  :root{--topbar-h:60px}
  html,body{overflow:auto}
  #hub{flex-direction:column;height:auto}
  .path{
    min-height:calc(50svh - 30px);
    min-height:calc(50vh - 30px);
    flex:1!important;
    padding:clamp(2rem,5vw,2.8rem) clamp(1.4rem,5vw,2rem);
  }
  .path:hover{background:#fff}
  .path-divider{width:auto;height:1px;margin:0 clamp(1.2rem,4vw,2rem);align-self:auto}
  .path-title{font-size:clamp(1.9rem,8vw,2.8rem)}
  .path-num{font-size:clamp(4rem,15vw,6rem)}
  .path-eye{font-size:.68rem;letter-spacing:.2em}
  .path-sub{font-size:.9rem;max-width:100%;line-height:1.65}
  .path-cta{font-size:.88rem;padding:.85rem 1.6rem}
  .path-tag{font-size:.68rem;padding:.32rem .8rem}
}

/* SMALL MOBILE */
@media(max-width:390px){
  .path-title{font-size:1.75rem}
  .path{padding:1.8rem 1.3rem}
}
</style>

<script>
gsap.timeline({defaults:{ease:'power3.out'}})
  .to('.logo-img',{opacity:1,duration:.5,delay:.05})

  .to('.path-eye',{opacity:1,duration:.45,stagger:.1},'.2')

  .to('.path-sub',{opacity:1,duration:.4,stagger:.1},'.45')
