  #topbar{

    background:rgba(10,10,20,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);

  .tb-logo span{font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.55)}

  .tb-home:hover{background:rgba(255,255,255,.14);color:#fff}

  /* PDF VIEWER */
  #viewer{
    position:fixed;top:52px;left:0;right:0;bottom:0;
  }
  #viewer iframe{
    width:100%;height:100%;border:none;display:block;
  }

  /* MOBILE FALLBACK */
  #mobile-fallback{
    display:none;
    position:fixed;top:52px;left:0;right:0;bottom:0;
    background:#0d0d1a;
    flex-direction:column;align-items:center;justify-content:center;

<script>

  var isMobile = /iPhone|iPad|iPod|Android/i.test(ua);

    document.getElementById('viewer').style.display = 'none';
